<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Text-to-Speech Offline</title>

    <!-- PWA & Mobile Optimization -->
    <meta name="theme-color" content="#4a5568">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TTS Offline">
    <meta name="description" content="Text-to-Speech - Works completely offline">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            -webkit-user-select: none;
            user-select: none;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .offline-badge {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 20px;
            border: 3px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1.1em;
            font-family: inherit;
            resize: vertical;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-group {
            background: #f7fafc;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
        }

        label {
            display: block;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1em;
            background: white;
            cursor: pointer;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: 3px solid #667eea;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .value-display {
            text-align: center;
            font-weight: bold;
            color: #667eea;
            margin-top: 8px;
            font-size: 1.1em;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 50px;
            font-size: 1.15em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .status {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: #f7fafc;
            border-radius: 12px;
            font-size: 1.05em;
            color: #4a5568;
            border: 2px solid #e2e8f0;
        }

        .status.speaking {
            background: linear-gradient(135deg, #c6f6d5 0%, #9ae6b4 100%);
            color: #22543d;
            border-color: #38ef7d;
        }

        .char-count {
            text-align: right;
            color: #718096;
            font-size: 0.9em;
            margin-top: -15px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔊 Text-to-Speech</h1>
        <p class="subtitle">100% Offline - No Internet Required</p>
        <div style="text-align: center;">
            <span class="offline-badge">✓ Works Offline</span>
        </div>

        <textarea id="textInput" placeholder="Type or paste your text here...">Hello! This is a text-to-speech app that works completely offline. Try adjusting the voice, speed, and pitch settings below!</textarea>

        <div class="char-count">
            <span id="charCount">0</span> characters
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Voice</label>
                <select id="voiceSelect">
                    <option>Loading voices...</option>
                </select>
            </div>

            <div class="control-group">
                <label>Language Filter</label>
                <select id="langFilter">
                    <option value="all">All Languages</option>
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh">Chinese</option>
                </select>
            </div>

            <div class="control-group">
                <label>Speed: <span id="rateValue">1.0x</span></label>
                <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
            </div>

            <div class="control-group">
                <label>Pitch: <span id="pitchValue">1.0</span></label>
                <input type="range" id="pitch" min="0" max="2" step="0.1" value="1">
            </div>
        </div>

        <div class="buttons">
            <button class="btn btn-primary" id="speakBtn">▶️ Speak</button>
            <button class="btn btn-secondary" id="pauseBtn">⏸️ Pause</button>
            <button class="btn btn-secondary" id="resumeBtn">▶️ Resume</button>
            <button class="btn btn-danger" id="stopBtn">⏹️ Stop</button>
        </div>

        <div class="status" id="status">Ready to speak</div>
    </div>

    <script>
        let voices = [];
        let currentUtterance = null;

        // DOM elements
        const textInput = document.getElementById('textInput');
        const voiceSelect = document.getElementById('voiceSelect');
        const langFilter = document.getElementById('langFilter');
        const rateInput = document.getElementById('rate');
        const pitchInput = document.getElementById('pitch');
        const rateValue = document.getElementById('rateValue');
        const pitchValue = document.getElementById('pitchValue');
        const speakBtn = document.getElementById('speakBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');
        const charCount = document.getElementById('charCount');

        // Initialize
        if ('speechSynthesis' in window) {
            loadVoices();
            speechSynthesis.onvoiceschanged = loadVoices;
        } else {
            status.textContent = '❌ Speech synthesis not supported in this browser';
            status.style.background = '#fed7d7';
            status.style.color = '#742a2a';
        }

        function loadVoices() {
            voices = speechSynthesis.getVoices();
            populateVoiceList();
        }

        function populateVoiceList() {
            const filterLang = langFilter.value;
            const filteredVoices = filterLang === 'all'
                ? voices
                : voices.filter(voice => voice.lang.startsWith(filterLang));

            voiceSelect.innerHTML = '';

            if (filteredVoices.length === 0) {
                voiceSelect.innerHTML = '<option>No voices available</option>';
                return;
            }

            filteredVoices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = voices.indexOf(voice);
                option.textContent = `${voice.name} (${voice.lang})`;

                // Select default voice
                if (voice.default) {
                    option.selected = true;
                }

                voiceSelect.appendChild(option);
            });
        }

        // Event listeners
        langFilter.addEventListener('change', populateVoiceList);

        rateInput.addEventListener('input', (e) => {
            rateValue.textContent = e.target.value + 'x';
        });

        pitchInput.addEventListener('input', (e) => {
            pitchValue.textContent = e.target.value;
        });

        textInput.addEventListener('input', () => {
            charCount.textContent = textInput.value.length;
        });

        speakBtn.addEventListener('click', speak);
        pauseBtn.addEventListener('click', pause);
        resumeBtn.addEventListener('click', resume);
        stopBtn.addEventListener('click', stop);

        function speak() {
            const text = textInput.value.trim();

            if (!text) {
                alert('Please enter some text to speak');
                return;
            }

            // Stop any ongoing speech
            speechSynthesis.cancel();

            currentUtterance = new SpeechSynthesisUtterance(text);
            const selectedVoice = voices[voiceSelect.value];

            currentUtterance.voice = selectedVoice;
            currentUtterance.rate = parseFloat(rateInput.value);
            currentUtterance.pitch = parseFloat(pitchInput.value);

            currentUtterance.onstart = () => {
                status.textContent = '🔊 Speaking...';
                status.classList.add('speaking');
            };

            currentUtterance.onend = () => {
                status.textContent = '✓ Finished speaking';
                status.classList.remove('speaking');
            };

            currentUtterance.onerror = (event) => {
                status.textContent = '❌ Error: ' + event.error;
                status.classList.remove('speaking');
            };

            speechSynthesis.speak(currentUtterance);
        }

        function pause() {
            if (speechSynthesis.speaking && !speechSynthesis.paused) {
                speechSynthesis.pause();
                status.textContent = '⏸️ Paused';
                status.classList.remove('speaking');
            }
        }

        function resume() {
            if (speechSynthesis.paused) {
                speechSynthesis.resume();
                status.textContent = '🔊 Speaking...';
                status.classList.add('speaking');
            }
        }

        function stop() {
            speechSynthesis.cancel();
            status.textContent = '⏹️ Stopped';
            status.classList.remove('speaking');
        }

        // Initialize character count
        charCount.textContent = textInput.value.length;
    </script>
</body>
</html>
