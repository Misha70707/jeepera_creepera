      - pair_programming_mode: Real-time collaboration with AI
      - code_review_automation: PR review suggestions
      - custom_ai_personalities: Choose mentor style (strict, encouraging, etc.)

    q3_2026:
      - ide_extensions: VS Code, IntelliJ, Xcode extensions (sync with mobile)
      - web_app: Full-featured web version (Next.js)
      - team_workspaces: Shared projects for pro/enterprise

    q4_2026:
