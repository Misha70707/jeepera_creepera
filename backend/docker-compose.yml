version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: codeforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: codeforge_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: codeforge_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_password
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (Optional - Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: codeforge_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@codeforgeai.app
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  # API Service (Node.js example - uncomment when ready)
  # api:
  #   build:
  #     context: ./api
  #     dockerfile: Dockerfile.dev
  #   container_name: codeforge_api
  #   restart: unless-stopped
  #   environment:
  #     NODE_ENV: development
  #     PORT: 3000
  #     DATABASE_URL: postgresql://postgres:password@postgres:5432/codeforge_dev
  #     REDIS_URL: redis://:redis_password@redis:6379
  #     JWT_SECRET: your_jwt_secret_change_this
  #     OPENAI_API_KEY: ${OPENAI_API_KEY}
  #   ports:
  #     - '3000:3000'
  #   volumes:
  #     - ./api:/app
  #     - /app/node_modules
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   command: npm run dev

  # ML Service (Python example - uncomment when ready)
  # ml-service:
  #   build:
  #     context: ./ml-service
  #     dockerfile: Dockerfile.dev
  #   container_name: codeforge_ml
  #   restart: unless-stopped
  #   environment:
  #     PYTHON_ENV: development
